services:
  backend:
    build:
      context: ./Backend
    container_name: uft_backend
    env_file:
      - ./.env
    environment:
      ERP_ENV: development
      ERP_PUBLIC_ORIGIN: ${ERP_PUBLIC_ORIGIN:-http://localhost}
      DATABASE_HOST: ${ERP_DATABASE_HOST:-host.docker.internal}
      FORWARDED_ALLOW_IPS: ${ERP_TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      ERP_MEDIA_DIR: /app/var/media
    volumes:
      - erp_media:/app/var/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - uft_network
  frontend:
    build:
      context: ./frontend
    container_name: uft_frontend
    env_file:
      - path: ./frontend/.env
        required: false
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uft_network
    
  proxy:
    image: nginx:latest
    container_name: uft_nginx
    ports:
      - "80:80"              
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - uft_network

networks:
  uft_network:

volumes:
  erp_media:
