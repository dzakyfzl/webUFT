name: Deploy to Production

on:
  push:
    branches:
      - production

# Hanya satu deployment boleh berjalan sekaligus.
# Jika ada push baru saat deploy sedang berjalan, yang lama dibatalkan.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup SSH agent ─────────────────────────────────────────────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # ── 3. Tambah server ke known_hosts ────────────────────────────────────
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 4. Deploy ke server ────────────────────────────────────────────────
      - name: Deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} << 'ENDSSH'
            set -e

            echo "========================================="
            echo "  UFT Web Deploy — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="

            cd ${{ secrets.PROJECT_PATH }}

            # ── Git pull ──────────────────────────────────────────────────
            echo "[1/2] Pulling latest code..."
            git fetch origin production
            git reset --hard origin/production
            echo "      OK Code updated"

            # ── Build & restart containers ─────────────────────────────────
            echo "[2/2] Building & restarting containers..."
            docker compose up -d --build --remove-orphans
            echo "      OK Done"

            docker compose ps
          ENDSSH

      # ── 5. Notifikasi gagal ────────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy GAGAL. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
