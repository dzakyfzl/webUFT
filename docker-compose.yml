services:
  backend:
    build:
      context: ./Backend
    container_name: uft_backend
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      DEBUG: "false"
      STORAGE_DIR: /app/storage
      MODULE_STORAGE_DIR: /app/storage/modules
      PUBLIC_FILE_BASE_URL: /static/modules
      DATABASE_URL: postgresql+psycopg2://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTE: ${ACCESS_TOKEN_EXPIRE_MINUTE}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IMAGE_QUALITY: ${IMAGE_QUALITY}
      SHORTLINK_DOMAIN: ${SHORTLINK_DOMAIN} 
    volumes:
      - backend_storage:/app/storage
      - ./media:/media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - caddy_net

  frontend:
    build:
      context: ./frontend
    container_name: uft_frontend
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - caddy_net

volumes:
  backend_storage:

networks:
  caddy_net:
    external: true
