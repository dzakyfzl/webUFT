services:
  backend:
    build:
      context: ./Backend
    container_name: uft_backend
    env_file:
      - ./.env
    environment:
      ERP_ENV: production
      ERP_PUBLIC_ORIGIN: ${ERP_PUBLIC_ORIGIN:-https://ukmfotografitelkom.com}
      DATABASE_HOST: ${ERP_DATABASE_HOST:-host.docker.internal}
      FORWARDED_ALLOW_IPS: ${ERP_TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      ERP_MEDIA_DIR: /app/var/media
    volumes:
      - erp_media:/app/var/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - caddy_net
  frontend:
    build:
      context: ./frontend
    container_name: uft_frontend
    env_file:
      - path: ./frontend/.env
        required: false
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true

volumes:
  erp_media:
